name: Daily Crawl

on:
  schedule:
    # 21:13 UTC = 05:13 Beijing. Cold slot on purpose: the previous setting
    # (05:00 UTC) is US-Eastern midnight on the hour, GitHub's most congested
    # cron slot, and all 25 of the last runs were dispatched 2h10m-5h36m late.
    # Firing at 05:13 Beijing leaves ~2h45m of delay budget before the 08:00
    # deadline Megatron pulls against.
    - cron: '13 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
    steps:
      # v5+ run on Node 24. v4/v5/v4 target Node 20, which GitHub is
      # deprecating (forced onto Node 24 until the runtime is removed).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Install via uv against the committed uv.lock, so CI is byte-for-byte
      # reproducible instead of re-resolving `>=` ranges at run time. A silent
      # bump to twscrape 0.20.1 on 2026-08-25 (from `>=0.17.0`) is what caused
      # the XClIdParseError failure. `--no-dev` keeps pytest off the runner.
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # 30h, not 24h: jitter means a run can start up to 5h36m later than the
      # previous one, and a 24h window would leave that stretch uncollected.
      # The overlap is absorbed by external_id dedup when the bundle is written.
      # Retry loop: twscrape XClIdGen / CDN fetch failures can cause silent 0-tweet
      # returns. A fresh process restart clears any cached broken module state.
      - name: Run crawl with retry
        run: |
          for i in 1 2; do
            echo "::group::Crawl attempt $i/2"
            if soundwave crawl --hours 30; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ $i -lt 2 ]; then
              echo "::warning::Attempt $i failed, waiting 60s before process-level retry..."
              sleep 60
            fi
          done
          echo "::error::All 2 crawl attempts failed"
          exit 1
        timeout-minutes: 10

      - name: Upload raw archive
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: soundwave-raw-${{ github.run_id }}
          path: data/
          retention-days: 14

      - name: Commit data and bundle
        if: success()
        run: |
          git config user.name "Soundwave Bot"
          git config user.email "actions@github.com"
          git add -f data/ bundles/
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Crawl failed! Common causes:"
          echo "::error::1. AUTH_FAILED: Update TWITTER_AUTH_TOKEN and TWITTER_CT0 in Settings > Secrets"
          echo "::error::2. RATE_LIMITED: Increase delays in config/settings.json"
          echo "::error::3. ZERO_TWEETS: crawl returned nothing - almost always auth, not a quiet day"
          echo "::error::4. NETWORK: Check if Twitter is accessible from this runner"
